<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viola Fingering Advisor</title>
  <script src="https://unpkg.com/opensheetmusicdisplay@1.8.4/build/opensheetmusicdisplay.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f4f0;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      background: #2c1a0e;
      color: #f0e8d8;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header span { font-size: .88rem; opacity: .7; }

    .upload-panel {
      max-width: 660px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 1.8rem;
    }
    .upload-panel h2 { font-size: 1rem; margin-bottom: 1rem; color: #4a3520; }

    .drop-zone {
      border: 2px dashed #c8b99a;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .drop-zone:hover, .drop-zone.dragover { background: #fdf6ec; border-color: #9a7c50; }
    .drop-zone input[type=file] { display: none; }
    .drop-zone .icon { font-size: 2.2rem; margin-bottom: .4rem; }
    .drop-zone p { color: #888; font-size: .9rem; }
    .drop-zone p strong { color: #5a3e1b; }
    .badge {
      display: inline-block;
      background: #f0e8d8;
      color: #5a3e1b;
      border-radius: 4px;
      padding: .1rem .45rem;
      font-size: .78rem;
      font-weight: 600;
      margin: 0 .15rem;
    }
    #file-name { margin-top: .6rem; font-size: .88rem; color: #5a3e1b; font-weight: 500; }

    .btn-analyze {
      margin-top: 1rem;
      width: 100%;
      padding: .8rem;
      background: #5a3e1b;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-analyze:hover:not(:disabled) { background: #7a5425; }
    .btn-analyze:disabled { background: #c8b99a; cursor: not-allowed; }

    #status {
      max-width: 660px;
      margin: 0 auto .8rem;
      padding: .75rem 1.1rem;
      border-radius: 6px;
      font-size: .9rem;
      display: none;
    }
    #status.info  { background: #e8f4fd; color: #1a6fa0; display: block; }
    #status.error { background: #fdecea; color: #b71c1c; display: block; }
    #status.warn  { background: #fff8e1; color: #795548; display: block; }

    /* ── Sheet wrapper ── */
    #sheet-wrap {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1rem;
      display: none;
    }
    #sheet-container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      padding: 1.5rem 2rem;
      overflow-x: auto;
    }

    /* Style fingering numbers rendered by OSMD */
    #sheet-container svg text.fingering,
    #sheet-container svg text[class*="fingering"] {
      font-size: 11px !important;
      font-weight: 700 !important;
      fill: #c0392b !important;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🎻 Viola Fingering Advisor</h1>
    <span>Upload a music score — PDF or MusicXML — to get fingering suggestions</span>
  </div>
</header>

<div class="upload-panel">
  <h2>Upload Score</h2>
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" accept=".pdf,.xml,.mxl,.musicxml" />
    <div class="icon">🎼</div>
    <p>Drag &amp; drop or <strong>click to browse</strong></p>
    <p style="margin-top:.35rem">
      <span class="badge">PDF</span>
      <span class="badge">XML</span>
      <span class="badge">MXL</span>
      <span class="badge">MusicXML</span>
    </p>
    <div id="file-name"></div>
  </div>
  <button class="btn-analyze" id="btn-analyze" disabled>Analyze</button>
</div>

<div id="status"></div>
<div id="sheet-wrap"><div id="sheet-container"></div></div>

<script>
  const API_BASE = window.location.hostname === 'shintachibana.github.io'
    ? 'https://viola-fingering.onrender.com'
    : '';

  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const fileNameEl = document.getElementById('file-name');
  const btnAnalyze = document.getElementById('btn-analyze');
  const statusEl   = document.getElementById('status');
  const sheetWrap  = document.getElementById('sheet-wrap');
  const sheetEl    = document.getElementById('sheet-container');

  let selectedFile = null;
  let osmd = null;

  // ── File selection ──────────────────────────────────────────────────────
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    const isPdf = file.name.toLowerCase().endsWith('.pdf');
    fileNameEl.textContent = (isPdf ? '📄 ' : '🎵 ') + file.name;
    btnAnalyze.disabled = false;
  }

  // ── Analyze ─────────────────────────────────────────────────────────────
  btnAnalyze.addEventListener('click', async () => {
    if (!selectedFile) return;
    const isPdf = selectedFile.name.toLowerCase().endsWith('.pdf');

    btnAnalyze.disabled = true;
    btnAnalyze.innerHTML = '<span class="spinner"></span> Processing…';
    setStatus('info', isPdf
      ? '⏳ Converting PDF → MusicXML (this takes 20–60 s)…'
      : '⏳ Parsing score and computing fingerings…');
    sheetWrap.style.display = 'none';

    const form = new FormData();
    form.append('file', selectedFile);

    try {
      const res = await fetch(`${API_BASE}/analyze`, { method: 'POST', body: form });
      const data = await res.json();

      if (data.error) {
        setStatus('error', '⚠ ' + data.error);
        return;
      }

      setStatus('info', '🎼 Rendering score… please wait');
      await new Promise(resolve => setTimeout(resolve, 60));
      await renderSheet(data.preview_xml, data.musicxml);
      statusEl.style.display = 'none';

    } catch (err) {
      setStatus('error', '⚠ Network error: ' + err.message);
    } finally {
      btnAnalyze.disabled = false;
      btnAnalyze.textContent = 'Analyze';
    }
  });

  // ── Render with OSMD ─────────────────────────────────────────────────────
  async function renderSheet(previewXml, fullXml) {
    sheetEl.innerHTML = '';
    document.getElementById('load-more-btn')?.remove();

    if (!window.opensheetmusicdisplay) {
      setStatus('error', '⚠ Music renderer not loaded yet. Please try again in a moment.');
      return;
    }

    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(sheetEl, {
      backend: 'svg',
      autoResize: false,
      drawTitle: true,
      drawSubtitle: true,
      drawComposer: true,
      drawPartNames: true,
      drawMeasureNumbers: true,
      drawFingerings: true,
      fingeringInsideStafflines: false,
      pageFormat: 'Endless',
      pageBackgroundColor: '#ffffff',
    });

    // Load and render the small preview XML — fast because it's only 50 measures
    await osmd.load(previewXml);
    osmd.render();
    sheetWrap.style.display = 'block';
    styleFingerings();

    if (fullXml && fullXml !== previewXml) {
      addLoadMoreButton(fullXml);
    }
  }

  function addLoadMoreButton(fullXml) {
    const btn = document.createElement('button');
    btn.id = 'load-more-btn';
    btn.textContent = 'Show full score — rendering takes ~15 s';
    btn.style.cssText = [
      'display:block', 'margin:1rem auto 2rem', 'padding:.7rem 1.4rem',
      'background:#5a3e1b', 'color:#fff', 'border:none', 'border-radius:6px',
      'font-size:.95rem', 'cursor:pointer',
    ].join(';');
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = '⏳ Rendering full score… please wait';
      await new Promise(r => setTimeout(r, 60));
      sheetEl.innerHTML = '';
      await osmd.load(fullXml);
      osmd.render();
      styleFingerings();
      btn.remove();
    };
    sheetWrap.appendChild(btn);
  }

  function styleFingerings() {
    sheetEl.querySelectorAll('svg text').forEach(t => {
      if (/^[0-4]$/.test(t.textContent.trim())) {
        t.style.fill = '#c0392b';
        t.style.fontWeight = '900';
        t.style.fontSize = '10px';
      }
    });
  }

  function setStatus(cls, msg) {
    statusEl.className = cls;
    statusEl.textContent = msg;
  }
</script>
</body>
</html>
